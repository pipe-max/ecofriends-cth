<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ecofriends 2026–2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="api.js"></script>
<script src="photo-framing.js"></script>
<style>
  :root{
    --bg:#6fa860;
    --surface:#ffffff;
    --surface-2:#eaf4e6;
    --ink:#173a24;
    --ink-soft:#4d6b56;
    --line:#dbeada;
    --accent:#ff6a3d;
    --accent-deep:#e04e22;
    --accent-soft:#ffe4d6;
    --leaf:#2f9e58;
    --leaf-deep:#1f7a41;
    --leaf-light:#5bc17e;
    --leaf-soft:#dcf3e2;
    --sun:#ffc93c;
    --sun-deep:#c98700;
    --sky:#4fb3e0;
    --sky-deep:#1979b8;
    --danger:#d64545;

    --grad-leaf: linear-gradient(135deg, var(--leaf-deep), var(--leaf-light));
    --grad-sun: linear-gradient(135deg, var(--sun), #ffdd7a);
    --grad-accent: linear-gradient(135deg, var(--accent-deep), var(--accent));

    --shadow: 0 10px 30px rgba(23,58,36,.10);
    --shadow-lg: 0 22px 46px -18px rgba(9,20,13,.25);
    --sticker: 5px 5px 0 0 var(--ink);
    --sticker-sm: 3px 3px 0 0 var(--ink);
    --sticker-hover: 7px 7px 0 0 var(--ink);

    --radius-lg: 24px;
    --radius-md: 16px;
    --bounce: cubic-bezier(.34,1.56,.64,1);
    --ease: cubic-bezier(.22,1,.36,1);

    --candidate-hover:#fff3c4;

    --tint-bg:#cfe8c0; --tint-line:#9cc98a;
    color-scheme: light;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overflow-x:hidden;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Nunito',system-ui,sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Baloo 2','Nunito',system-ui,sans-serif;
    text-wrap:balance;
    margin:0;
  }
  a{color:inherit;}
  .container{max-width:1000px;margin:0 auto;padding:0 18px;}
  .wrap{max-width:1000px;margin:0 auto;padding:26px 18px 64px;}

  /* ---------- Header ---------- */
  .site-header{
    background:url('fondohierba.png') center 60%/cover no-repeat;
    color:#fff;
    padding:54px 0 40px;
    box-shadow:var(--shadow-lg);
    position:relative;
    overflow:hidden;
  }
  .top-hairline{position:absolute;left:0;right:0;top:0;height:6px;z-index:1;
    background:linear-gradient(90deg, var(--sun) 25%, var(--leaf-light) 50%, var(--sky) 75%, var(--accent));}
  .site-header .container{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;}
  .site-header .logo-frame{width:min(88vw,540px);}
  .site-header .logo-frame img{display:block;width:100%;height:auto;}
  .school-badge{position:absolute;top:18px;right:18px;width:min(34vw,160px);z-index:2;}
  .school-badge img{display:block;width:100%;height:auto;filter:drop-shadow(0 3px 8px rgba(0,0,0,.3));}
  .site-header h1{
    font-size:clamp(1.6rem,1.1rem + 2vw,2.4rem);font-weight:800;margin:2px 0 0;line-height:1.08;
    color:var(--leaf-deep);
    text-shadow:0 0 6px #fff, 0 0 12px #fff, 0 2px 0 #fff;
  }
  nav.top-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px;}
  .btn-hero{
    padding:11px 22px;border-radius:999px;font-weight:800;font-size:.9rem;font-family:'Nunito',sans-serif;
    background:rgba(255,255,255,.12);color:#fff;border:2px solid rgba(255,255,255,.4);
    cursor:pointer;transition:.18s var(--bounce);backdrop-filter:blur(6px);min-height:44px;
  }
  .btn-hero:hover{background:rgba(255,255,255,.22);transform:translateY(-2px) scale(1.02);}
  .btn-hero.active{background:var(--grad-sun);color:#4a3400;border-color:#fff;}

  /* ---------- Breadcrumbs ---------- */
  .breadcrumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:18px;font-weight:700;font-size:.85rem;color:var(--ink-soft);}
  .breadcrumbs button{background:none;border:none;color:var(--leaf-deep);font-weight:800;cursor:pointer;font-size:.85rem;padding:4px 2px;font-family:inherit;}
  .breadcrumbs button:hover{text-decoration:underline;}
  .breadcrumbs .sep{opacity:.5;}

  /* ---------- Section blocks ---------- */
  .section-block{
    margin-bottom:22px;padding:22px 20px 24px;border-radius:var(--radius-lg);
    background:var(--tint-bg);border:2px solid var(--tint-line);
  }
  .section-block h2{font-size:1.4rem;margin-bottom:16px;}

  /* ---------- Groups grid ---------- */
  .groups-grid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;--group-columns:6;}
  .group-card{
    flex:0 0 calc((100% - (var(--group-columns) - 1)*12px)/var(--group-columns));min-width:0;
    border:2.5px solid var(--ink);background:var(--surface);border-radius:var(--radius-md);
    padding:16px 14px;cursor:pointer;font-family:inherit;text-align:left;transition:.16s var(--bounce);
    box-shadow:var(--sticker-sm);position:relative;
  }
  .group-card:hover{transform:translate(-2px,-2px);box-shadow:var(--sticker-hover);background:var(--leaf-soft);}
  .group-card:active{transform:translate(1px,1px);box-shadow:2px 2px 0 0 var(--ink);}
  .group-card .g{font-family:'Baloo 2';font-weight:700;font-size:1.05rem;}
  .group-card .c{display:block;margin-top:4px;color:var(--ink-soft);font-size:.78rem;font-weight:700;}
  .group-card.done{cursor:default;opacity:.85;}
  .group-card.done:hover{transform:none;box-shadow:var(--sticker-sm);background:var(--surface);}
  .group-card.locked{cursor:not-allowed;opacity:.55;}
  .group-card.locked:hover{transform:none;box-shadow:var(--sticker-sm);background:var(--surface);}
  .group-card.locked .c{color:var(--danger);}

  .decided-card{
    border:2.5px dashed var(--sun-deep);background:var(--surface-2);border-radius:var(--radius-md);
    padding:16px;display:flex;gap:14px;align-items:center;
  }
  .decided-card .badge{
    width:44px;height:44px;border-radius:50%;background:var(--grad-sun);color:#4a3400;display:flex;align-items:center;justify-content:center;
    font-family:'Baloo 2';font-weight:800;font-size:1.2rem;flex:none;border:2px solid var(--ink);
  }
  .decided-card p{margin:0;color:var(--ink-soft);font-weight:700;font-size:.9rem;}
  .decided-card strong{color:var(--ink);font-size:1.02rem;}

  /* ---------- Ballot banner ---------- */
  .ballot-banner{
    background:var(--leaf-deep);border-radius:var(--radius-lg) var(--radius-lg) 0 0;
    padding:20px 24px;position:relative;overflow:hidden;color:#fff;
    border:2.5px solid var(--ink);border-bottom:none;
  }
  .banner-inner{position:relative;z-index:1;}
  .banner-kicker{font-size:1.1rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--sun);}
  .banner-title{font-family:'Baloo 2';font-weight:800;font-size:clamp(2.6rem,6.5vw,4rem);margin-top:0;line-height:1;}

  .ballot-card{background:var(--surface);border:2.5px solid var(--ink);border-top:none;border-radius:0 0 var(--radius-lg) var(--radius-lg);
    box-shadow:var(--sticker);padding:22px;margin-bottom:26px;}

  .candidates-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;}
  .candidate-btn{
    display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;
    background:var(--bg);border:2.5px solid var(--line);border-radius:18px;padding:18px 12px;cursor:pointer;
    font-family:inherit;transition:transform .16s var(--bounce), box-shadow .16s var(--bounce), border-color .16s ease, background .16s ease;
    width:160px;flex:0 0 auto;
  }
  .candidate-btn:hover{transform:translate(-2px,-2px);background:var(--candidate-hover);border-color:var(--sun-deep);box-shadow:var(--sticker-sm);}
  .candidate-btn:active{transform:scale(.97);}
  .avatar{
    position:relative;
    width:110px;height:110px;border-radius:50%;flex:none;
    background:var(--grad-leaf);display:flex;align-items:center;justify-content:center;
    color:#fff;font-family:'Baloo 2';font-weight:700;font-size:1.9rem;
    box-shadow:0 0 0 3px #fff, 0 0 0 5px var(--line);overflow:hidden;
  }
  .avatar img{
    display:block;width:100%;height:100%;object-fit:contain;object-position:center;
  }
  .candidate-btn:hover .avatar{box-shadow:0 0 0 3px #fff, 0 0 0 5px var(--sun-deep);}
  .cand-name{font-weight:800;font-size:.95rem;font-family:'Baloo 2';line-height:1.2;}

  .confirm-overlay{
    position:fixed;inset:0;background:rgba(10,20,12,.6);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:50;animation:fadeIn .18s ease;
  }
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .confirm-box{
    background:var(--surface);border-radius:var(--radius-lg);padding:28px;max-width:380px;width:100%;
    border:3px solid var(--ink);box-shadow:8px 8px 0 0 var(--ink);text-align:center;
    animation:modalIn .22s var(--bounce);
  }
  @keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:none;}}
  .confirm-box .avatar{margin:0 auto 12px;width:76px;height:76px;font-size:1.5rem;}
  .confirm-box h3{font-size:1.2rem;margin-bottom:4px;font-family:'Baloo 2';}
  .confirm-box p{color:var(--ink-soft);margin:0 0 20px;font-weight:700;}
  .confirm-actions{display:flex;gap:10px;}
  .confirm-actions button{flex:1;padding:12px;border-radius:999px;font-weight:800;font-family:'Baloo 2';cursor:pointer;border:2.5px solid var(--ink);font-size:.92rem;transition:.16s var(--bounce);}
  .btn-cancel{background:var(--surface-2);color:var(--ink);}
  .btn-cancel:hover{background:var(--line);}
  .btn-confirm{background:var(--grad-leaf);color:#fff;box-shadow:var(--sticker-sm);}
  .btn-confirm:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 0 var(--ink);}
  .btn-confirm:disabled{opacity:.6;transform:none;box-shadow:var(--sticker-sm);}

  .thanks{
    text-align:center;padding:48px 20px;background:var(--surface);border-radius:var(--radius-lg);
    border:2.5px solid var(--ink);box-shadow:var(--sticker);
  }
  .thanks .big-check{
    width:74px;height:74px;border-radius:50%;background:var(--leaf-soft);color:var(--leaf-deep);
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:2.1rem;border:2.5px solid var(--ink);
  }
  .thanks h2{margin-bottom:6px;}
  .thanks p{color:var(--ink-soft);font-weight:700;}
  .thanks .btn-next-vote{
    margin-top:12px;padding:12px 22px;max-width:100%;min-height:44px;
    border:2.5px solid var(--ink);border-radius:999px;
    font-family:'Baloo 2','Nunito',system-ui,sans-serif;font-size:1rem;font-weight:800;
    cursor:pointer;transition:.16s var(--bounce);
  }
  .btn-next-vote:focus-visible{outline:3px solid var(--sun-deep);outline-offset:4px;}

  .banner{
    display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:var(--radius-md);
    font-weight:700;font-size:.88rem;margin-bottom:16px;border:2px solid transparent;
  }
  .banner.error{background:#fde8e8;color:var(--danger);border-color:var(--danger);}

  /* ---------- Results ---------- */
  .results-group{
    background:var(--surface);border:2.5px solid var(--ink);border-radius:var(--radius-md);
    padding:18px 20px;margin-bottom:14px;box-shadow:var(--sticker-sm);
  }
  .results-group h3{font-size:1.05rem;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;font-family:'Baloo 2';}
  .results-group h3 .total{font-size:.78rem;color:var(--ink-soft);font-weight:700;font-variant-numeric:tabular-nums;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
  .bar-row .name{width:180px;flex:none;font-weight:700;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bar-track{flex:1;background:var(--surface-2);border-radius:999px;height:16px;overflow:hidden;border:1.5px solid var(--line);}
  .bar-fill{height:100%;background:var(--grad-leaf);border-radius:999px;transition:width .4s ease;}
  .bar-row .count{width:34px;flex:none;text-align:right;font-weight:800;font-variant-numeric:tabular-nums;font-size:.85rem;}
  .bar-row.winner .name{color:var(--accent-deep);}
  .bar-row.winner .bar-fill{background:var(--grad-accent);}

  .empty-state{text-align:center;padding:40px 20px;color:var(--ink-soft);font-weight:700;}
  .loading{text-align:center;padding:40px;color:var(--ink-soft);font-weight:700;}
  footer{text-align:center;color:var(--ink-soft);font-size:.78rem;padding:22px;font-weight:700;}

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important;}
  }

  @media (max-width:820px){
    .groups-grid{--group-columns:3;}
  }
  @media (max-width:640px){
    .site-header{padding:26px 0 30px;}
    .hero{padding:20px 18px;}
    .groups-grid{--group-columns:2;}
    .candidate-btn{width:130px;}
    .candidate-btn .cand-name{color:#fff;-webkit-text-fill-color:#fff;}
    .candidate-btn:hover{background:var(--leaf-deep);}
    .avatar{width:90px;height:90px;}
    .bar-row .name{width:120px;}
  }
  .connection-status{max-width:964px;margin:14px auto 0;padding:0 18px;font-weight:800;}
  .connection-status:not(:empty){padding:12px 18px;background:#fff3c4;border:2px solid var(--sun-deep);border-radius:12px;}
  .candidate-btn:disabled{opacity:.6;cursor:wait;}
  .confirm-box button:disabled{opacity:.6;cursor:wait;}
  .recovery-button{padding:12px 22px;border:2px solid var(--ink);border-radius:999px;cursor:pointer;font:800 1rem 'Nunito',sans-serif;}
</style>
</head>
<body>

<header class="site-header">
  <div class="top-hairline"></div>
  <div class="school-badge"><img src="CTH.png" alt="Colegio Theodoro Herzl" /></div>
  <div class="container">
    <div class="logo-frame"><img src="theo.png" alt="Ecofriends" /></div>
    <h1>Elección de Ecofriends 2026–2027</h1>
    <nav class="top-actions">
      <button class="pill-btn btn-hero" id="nav-vote">🗳️ Votar</button>
    </nav>
  </div>
</header>

<div id="connection-status" class="connection-status" role="status" aria-live="polite"></div>
<main class="wrap" id="app">
  <div class="loading">Cargando…</div>
</main>

<footer>Colegio Theodoro Hertzl · <a href="admin.html">Admin</a></footer>

<script src="voting.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin — Ecofriends</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="api.js"></script>
<style>
  :root{
    --bg:#eef8f0;
    --surface:#ffffff;
    --surface-2:#eaf4e6;
    --ink:#173a24;
    --ink-soft:#4d6b56;
    --line:#dbeada;
    --leaf:#2f9e58;
    --leaf-deep:#1f7a41;
    --leaf-light:#5bc17e;
    --leaf-soft:#dcf3e2;
    --sun:#ffc93c;
    --danger:#d64545;
    --danger-soft:#fde8e8;

    --grad-leaf: linear-gradient(135deg, var(--leaf-deep), var(--leaf-light));
    --shadow: 0 10px 30px rgba(23,58,36,.10);
    --sticker: 5px 5px 0 0 var(--ink);
    --sticker-sm: 3px 3px 0 0 var(--ink);
    --radius-lg: 24px;
    --radius-md: 16px;
    --bounce: cubic-bezier(.34,1.56,.64,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;min-height:100vh;}
  h1,h2,h3{font-family:'Baloo 2','Nunito',system-ui,sans-serif;margin:0;}
  a{color:var(--leaf-deep);}
  .wrap{max-width:900px;margin:0 auto;padding:28px 18px 60px;}

  header.top{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:8px;}
  header.top img{width:240px;height:240px;object-fit:contain;}
  header.top h1{font-size:2rem;color:var(--leaf-deep);}
  header.top p{margin:4px 0 0;font-size:1.15rem;color:var(--ink-soft);font-weight:700;}

  .card{
    background:var(--surface);border:2.5px solid var(--ink);border-radius:var(--radius-lg);
    padding:24px;box-shadow:var(--sticker);margin-bottom:20px;
  }
  .card h2{font-size:1.2rem;margin-bottom:6px;}
  .card p.hint{color:var(--ink-soft);font-weight:600;margin:0 0 18px;font-size:.92rem;}

  .activation input{
    width:100%;box-sizing:border-box;padding:13px 14px;border:2px solid var(--line);border-radius:12px;
    font-size:1rem;font-family:inherit;text-align:center;letter-spacing:.03em;margin-bottom:12px;
  }
  .activation input:focus{outline:none;border-color:var(--leaf);}
  .btn{
    padding:12px 22px;border-radius:999px;font-weight:800;font-family:'Baloo 2';font-size:.95rem;
    cursor:pointer;border:2.5px solid var(--ink);background:var(--grad-leaf);color:#fff;
    box-shadow:var(--sticker-sm);transition:.16s var(--bounce);width:100%;
  }
  .btn:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 0 var(--ink);}
  .btn:disabled{opacity:.6;cursor:default;transform:none;box-shadow:var(--sticker-sm);}
  .error-msg{color:var(--danger);font-weight:700;font-size:.88rem;margin:0 0 12px;min-height:1.2em;}

  .section-title{font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--leaf-deep);margin:14px 0 6px;}
  .section-title:first-child{margin-top:0;}
  .grupos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;}
  .grupo-row{
    display:flex;align-items:center;justify-content:space-between;gap:6px;
    border:1.5px solid var(--line);border-radius:10px;padding:6px 6px 6px 10px;background:var(--surface-2);
    transition:.15s ease;
  }
  .grupo-row.open{border-color:var(--leaf);background:var(--leaf-soft);}
  .grupo-row .info{display:flex;align-items:baseline;gap:5px;min-width:0;}
  .grupo-row .name{font-weight:800;font-family:'Baloo 2';font-size:.85rem;white-space:nowrap;}
  .grupo-row .state{font-size:.64rem;font-weight:700;color:var(--ink-soft);white-space:nowrap;}
  .grupo-row.open .state{color:var(--leaf-deep);}

  .switch{position:relative;width:36px;height:20px;flex:none;}
  .switch input{opacity:0;width:0;height:0;position:absolute;}
  .switch .track{
    position:absolute;inset:0;background:#c9c9c9;border-radius:999px;cursor:pointer;transition:.2s ease;
    border:1.5px solid var(--ink);
  }
  .switch .track::before{
    content:"";position:absolute;width:13px;height:13px;left:2px;top:2px;background:#fff;border-radius:50%;
    transition:.2s var(--bounce);box-shadow:0 1px 3px rgba(0,0,0,.3);
  }
  .switch input:checked + .track{background:var(--leaf);}
  .switch input:checked + .track::before{transform:translateX(15px);}
  .switch input:disabled + .track{opacity:.5;cursor:default;}

  .loading, .empty-state{text-align:center;padding:30px;color:var(--ink-soft);font-weight:700;}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;font-weight:700;font-size:.85rem;
    box-shadow:0 8px 20px rgba(0,0,0,.3);z-index:80;opacity:0;pointer-events:none;transition:opacity .25s ease;
  }
  .toast.show{opacity:1;}
  .toast.error{background:var(--danger);}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0;align-items:center;}
  .toolbar .btn,.group-control{width:auto;}
  .btn.secondary{background:var(--surface-2);color:var(--ink);}
  .btn.danger{background:var(--danger);}
  .admin-group{padding:16px;border:2px solid var(--line);border-radius:14px;margin:10px 0;display:grid;grid-template-columns:1fr auto;gap:10px;}
  .admin-group.open{border-color:var(--leaf);background:var(--leaf-soft);}
  .admin-group h3{font-size:1.15rem;}
  .g-status{font-size:.8rem;font-weight:800;color:var(--ink-soft);}
  .participation{font-weight:800;margin:6px 0;}
  .expected-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem;}
  .expected-form input{width:82px;padding:8px;border:2px solid var(--line);border-radius:8px;font:inherit;}
  .expected-form button{padding:7px 12px;border-radius:8px;cursor:pointer;border:2px solid var(--ink);background:white;font:inherit;}
  #sync-status{font-weight:700;min-height:1.4em;}
  .mismatch{color:var(--danger);}
  .report-group{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0;break-inside:avoid;}
  .report-group h3{font-size:1.15rem;}
  .report-group p{margin:6px 0;font-size:.88rem;}
  .report-table{width:100%;border-collapse:collapse;font-size:.88rem;}
  .report-table th,.report-table td{padding:7px 5px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere;}
  .report-table th:nth-child(n+2),.report-table td:nth-child(n+2){text-align:right;white-space:nowrap;}
  .report-table th:first-child{width:72%;}
  .report-meta{font-size:.85rem;overflow-wrap:anywhere;}
  .report-winner{font-weight:800;}
  .report-section{margin-top:22px;break-after:avoid;}
  button:focus-visible,a:focus-visible{outline:3px solid var(--leaf);outline-offset:4px;}
  @media(max-width:600px){header.top{flex-direction:column;text-align:center;}header.top img{width:130px;height:130px;}.card{padding:16px;}.admin-group{grid-template-columns:1fr;}.group-control{width:100%;}}
  @page{size:A4;margin:14mm;}
  @media print{
    body{background:white;color:#14251a;font-family:Arial,sans-serif;}
    body:not(.printing-report) .wrap{display:none;}
    body:not(.printing-report)::before{content:'Abre el informe final desde el panel de administración para guardar el PDF.';}
    header.top,.no-print,#toast{display:none !important;}
    .wrap{max-width:none;padding:0;margin:0;}
    .card{border:0;box-shadow:none;border-radius:0;padding:0;margin:0;}
    h1,h2,h3{font-family:Arial,sans-serif;}
    .report-group{border:1px solid #a0aaa2;margin:9px 0;padding:10px;}
    .report-section{font-size:15pt;}
    .report-table{font-size:10pt;}
    .report-group p,.report-meta{font-size:9pt;}
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <img src="theo.png" alt="Ecofriends" />
    <div>
      <h1>Panel de administración</h1>
      <p>Salones, participación y resultados · Ecofriends 2026–2027</p>
    </div>
  </header>

  <div id="app"><div class="loading">Cargando…</div></div>
</div>

<div class="toast" id="toast"></div>

<script src="report.js"></script>
<script src="admin.js"></script>
</body>
</html>
